<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Carnet de Socio</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<script>

const socio = JSON.parse(localStorage.getItem("socio"));


if(!socio){

    window.location.href = "login.html";

}


</script>



<header>

<img src="LOGO.png" class="logo">

<h1>
Asociación Ornitológica de Navas de San Juan
</h1>

<p>
Mi Carnet de Socio
</p>

</header>



<main>

<h2>🪪 Carnet de Socio</h2>


<div class="panelAdmin">


<p id="nombreSocio"></p>


<a id="abrirCarnet" target="_blank" class="tarjetaAdmin">

🪪 Ver mi carnet en PDF

</a>


</div>


</main>



<script>


const socioActual = JSON.parse(localStorage.getItem("socio"));


document.getElementById("nombreSocio").textContent =
"Socio: " + socioActual.nombre;



if(socioActual.carnet){


document.getElementById("abrirCarnet").href =
"carnets/" + socioActual.carnet;


}else{


document.getElementById("abrirCarnet").textContent =
"❌ Carnet no disponible";


}



</script>


</body>

</html>
