<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Perfil</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<img src="LOGO.png" alt="Logo Asociación" class="logo">

<h1>Asociación Ornitológica de Navas de San Juan</h1>

<p>Mi Perfil</p>

</header>

<main>

<h2>👤 Datos del Socio</h2>

<label>Nombre</label>
<input type="text" id="nombre">

<label>Número de socio</label>
<input type="text" id="numero" disabled>

<label>Teléfono</label>
<input type="text" id="telefono">

<label>Dirección</label>
<input type="text" id="direccion">

<label>Código Postal</label>
<input type="text" id="cp">

<label>Población</label>
<input type="text" id="poblacion">

<label>Provincia</label>
<input type="text" id="provincia">

<br><br>

<button id="guardarPerfil">
💾 Guardar cambios
</button>

</main>

<script src="js/perfil.js"></script>

</body>

</html>
