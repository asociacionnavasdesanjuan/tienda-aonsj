<body>


<script>

const socio = JSON.parse(localStorage.getItem("socio"));


if(!socio){

    window.location.href = "login.html";

}


if(
    socio.rol !== "ADMIN" &&
    socio.rol !== "ADMIN_PRINCIPAL"
){

    window.location.href = "tienda.html";

}

</script>



<header>

<img src="LOGO.png" class="logo">

<h1>

</h1>

<p>
Configuración de la Tienda
</p>

</header>



<main>

<h2>🛒 Configuración Tienda</h2>


<div class="panelAdmin">


<div class="tarjetaAdmin">

</p>

</div>


<div class="tarjetaAdmin">

<h3>Pedidos</h3>

Controlar pedidos realizados por socios.
</p>

</div>


<div class="tarjetaAdmin">

</p>

</div>

</html>
