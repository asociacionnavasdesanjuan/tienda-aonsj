<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tienda Oficial del Socio</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="login">

<img src="LOGO.png" alt="Logo Asociación" class="logoLogin">

<h1>🛒 Tienda Oficial del Socio</h1>

<h3>Asociación Ornitológica de Navas de San Juan</h3>

<p class="textoAcceso">
🔒 Acceso exclusivo para socios
</p>


<!-- USUARIO -->

<div class="campoLogin">

<label for="usuario">Número de socio</label>

<input
type="text"
id="usuario"
placeholder="Ejemplo: 001"
autocomplete="username">

</div>


<!-- CONTRASEÑA -->

<div class="campoLogin">

<label for="password">Contraseña</label>

<div class="contenedorPassword">

<input
type="password"
id="password"
placeholder="Escribe tu contraseña"
autocomplete="current-password">

<button
type="button"
id="verPassword"
class="botonOjo"
aria-label="Mostrar contraseña">
👁️
</button>

</div>

</div>


<button id="entrar" class="botonEntrar">

ENTRAR

</button>

<p id="mensaje"></p>

</div>


<script src="js/login.js?v=2"></script>

<script>

const password = document.getElementById("password");
const botonVer = document.getElementById("verPassword");

botonVer.addEventListener("click", () => {

    if (password.type === "password") {

        password.type = "text";
        botonVer.textContent = "🙈";
        botonVer.setAttribute("aria-label", "Ocultar contraseña");

    } else {

        password.type = "password";
        botonVer.textContent = "👁️";
        botonVer.setAttribute("aria-label", "Mostrar contraseña");

    }

});

</script>

</body>

</html>
