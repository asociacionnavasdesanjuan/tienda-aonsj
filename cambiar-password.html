<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cambiar contraseña</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<img src="LOGO.png" class="logo">

<h1>
Asociación Ornitológica de Navas de San Juan
</h1>

<p>
Cambio de contraseña
</p>

</header>



<main>


<section class="login">


<h2>🔐 Nueva contraseña</h2>


<p>
Por seguridad debes cambiar tu contraseña inicial.
</p>


<label>
Nueva contraseña
</label>


<input 
type="password"
id="nuevaPassword"
placeholder="Nueva contraseña">



<label>
Repetir contraseña
</label>


<input
type="password"
id="repetirPassword"
placeholder="Repite la contraseña">



<br><br>


<button id="guardarPassword" class="botonEntrar">

Guardar contraseña

</button>


<p id="mensaje"></p>


</section>


</main>



<script src="js/cambiar-password.js"></script>


</body>

</html>
