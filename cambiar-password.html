<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cambiar contraseña</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="login">

<img src="LOGO.png" alt="Logo Asociación" class="logoLogin">

<h1>🔒 Cambiar contraseña</h1>

<h3>Asociación Ornitológica de Navas de San Juan</h3>

<p class="textoAcceso">

Por seguridad debes crear una contraseña nueva.

</p>

<div class="campoLogin">

<label>Nueva contraseña</label>

<input
type="password"
id="nuevaPassword"
placeholder="Nueva contraseña">

</div>

<div class="campoLogin">

<label>Repetir contraseña</label>

<input
type="password"
id="repetirPassword"
placeholder="Repite la contraseña">

</div>

<button id="guardar" class="botonEntrar">

GUARDAR CONTRASEÑA

</button>

<p id="mensaje"></p>

</div>

<script src="js/cambiar-password.js"></script>

</body>

</html>
