<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestión de Socios</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<img src="LOGO.png" class="logo">

<h1>Asociación Ornitológica de Navas de San Juan</h1>

<p>Gestión de Socios</p>

</header>
<!-- VENTANA EMERGENTE -->

<div id="ventanaSocio" class="modal" style="display:none;">

    <div class="modalContenido">

        <h2>➕ Nuevo Socio</h2>

       <label>Nombre completo</label>
<input type="text" id="nuevoNombre">


<label>DNI</label>
<input type="text" id="nuevoDni">


<label>Teléfono</label>
<input type="text" id="nuevoTelefono">


<label>Email</label>
<input type="email" id="nuevoEmail">


<label>Dirección</label>
<input type="text" id="nuevaDireccion">


<label>Código Postal</label>
<input type="text" id="nuevoCp">


<label>Población</label>
<input type="text" id="nuevoPoblacion">


<label>Provincia</label>
<input type="text" id="nuevoProvincia">


<p>
🔐 La contraseña inicial será el DNI del socio.
</p>
        <br><br>

        <button id="guardarNuevoSocio">
            💾 Guardar
        </button>

        <button id="cerrarVentana">
            ❌ Cancelar
        </button>

    </div>

</div>
<main>

<h2>👥 Gestión de Socios</h2>

<input
type="text"
id="buscarSocio"
placeholder="Buscar socio...">

<br><br>

<button id="nuevoSocio">

➕ Nuevo Socio

</button>

<br><br>

<table id="tablaSocios">

<thead>

<tr>

<th>Nº</th>

<th>Nombre</th>

<th>Teléfono</th>

<th>Estado</th>

<th>Acciones</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</main>

<script src="js/socios.js"></script>

</body>

</html>
