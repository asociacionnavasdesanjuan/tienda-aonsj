<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acceso Administrador</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="login">

<img src="LOGO.png" alt="Logo Asociación" class="logoLogin">

<h1>👨‍💼 Acceso de Administradores</h1>

<h3>Asociación Ornitológica de Navas de San Juan</h3>

<p class="textoAcceso">

🔒 Acceso exclusivo para administradores autorizados

</p>

<div class="campoLogin">

<label for="usuarioAdmin">Usuario</label>

<input
type="text"
id="usuarioAdmin"
placeholder="Escriba su usuario"
autocomplete="username">

</div>

<div class="campoLogin">

<label for="passwordAdmin">Contraseña</label>

<div class="contenedorPassword">

<input
type="password"
id="passwordAdmin"
placeholder="Escriba su contraseña"
autocomplete="current-password">

<button
type="button"
id="verPasswordAdmin"
class="botonOjo">

👁️

</button>

</div>

</div>

<button id="entrarAdmin" class="botonEntrar">

ENTRAR

</button>

<p id="mensajeAdmin"></p>

</div>

<script src="js/admin-login.js"></script>

<script>

const passwordAdmin = document.getElementById("passwordAdmin");
const verPasswordAdmin = document.getElementById("verPasswordAdmin");

verPasswordAdmin.onclick = function(){

    if(passwordAdmin.type==="password"){

        passwordAdmin.type="text";
        verPasswordAdmin.innerHTML="🙈";

    }else{

        passwordAdmin.type="password";
        verPasswordAdmin.innerHTML="👁️";

    }

}

</script>

</body>

</html>
