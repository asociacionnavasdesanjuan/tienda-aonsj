<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestión de Productos</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<img src="LOGO.png" class="logo">

<h1>Asociación Ornitológica de Navas de San Juan</h1>

<p>Gestión de Productos</p>

</header>

<main>

<h2>🛒 Gestión de Productos</h2>

<input
type="text"
id="buscarProducto"
placeholder="Buscar producto...">

<br><br>

<button id="nuevoProducto">

➕ Nuevo Producto

</button>

<br><br>

<table id="tablaProductos">

<thead>

<tr>

<th>Foto</th>

<th>Producto</th>

<th>Precio</th>

<th>Stock</th>

<th>Estado</th>

<th>Acciones</th>

</tr>

</thead>

<tbody>

</tbody>

</table>
<!-- VENTANA NUEVO PRODUCTO -->

<div id="ventanaProducto" class="modal" style="display:none;">

    <div class="modalContenido">

        <h2>➕ Nuevo Producto</h2>

        <label>Nombre</label>
        <input type="text" id="nuevoNombreProducto">

        <label>Descripción</label>
        <textarea id="nuevaDescripcionProducto"></textarea>

        <label>Precio (€)</label>
        <input type="number" id="nuevoPrecioProducto" step="0.01">

        <label>Stock</label>
        <input type="number" id="nuevoStockProducto">

        <label>Categoría</label>
        <select id="nuevaCategoriaProducto">
            <option>Anillas</option>
            <option>Alimentación</option>
            <option>Jaulas</option>
            <option>Accesorios</option>
        </select>

        <label>Ruta de la imagen</label>
        <input type="text" id="nuevaImagenProducto" placeholder="img/productos/foto.jpg">

        <br><br>

        <button id="guardarProducto">
            💾 Guardar
        </button>

        <button id="cerrarVentanaProducto">
            ❌ Cancelar
        </button>

    </div>

</div>
</main>

<script src="js/productos-admin.js"></script>

</body>

</html>
